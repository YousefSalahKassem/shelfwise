<!DOCTYPE html>
<!--
  ShelfWise web shell.

  This file is brand-neutral: `tools/scripts/gen_pwa_manifest.dart` rewrites the
  marked values (title, description, theme colour, splash colours, lang/dir) in
  `build/web/index.html` after `flutter build web`, so every brand ships its own
  name, colours and icon. Keep the anchors below intact — the generator matches
  them by attribute name. See TECHNICAL_STRUCTURE §13 and A7's brief.
-->
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Products, prices and stock for your store.">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ShelfWise">
  <meta name="theme-color" content="#0D6A56">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>ShelfWise</title>

  <style>
    :root {
      --brand-primary: #0D6A56;
      --brand-bg: #FBFDF9;
      --brand-bg-dark: #101410;
      --brand-fg: #1A1C1A;
      --brand-fg-dark: #E2E3DE;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--brand-bg);
      color: var(--brand-fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 200ms ease-out;
    }
    #splash img { width: 96px; height: 96px; object-fit: contain; }
    #splash .bar {
      width: 160px; height: 4px; border-radius: 2px;
      background: color-mix(in srgb, var(--brand-primary) 24%, transparent);
      overflow: hidden;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: var(--brand-primary);
      animation: sw-slide 1.1s ease-in-out infinite;
    }
    @keyframes sw-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-color-scheme: dark) {
      body { background: var(--brand-bg-dark); color: var(--brand-fg-dark); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      window.setTimeout(function () { splash.remove(); }, 220);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
