name: shelfwise
description: "ShelfWise — white-label product, price and stock manager for stores."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

# Versions resolved at W0 (Flutter 3.44 / Dart 3.12) and pinned. freezed is on 4.0.0-dev.3 because
# 4.0.1 needs a newer analyzer than riverpod_generator supports — revisit when both align.
# Agents: do NOT edit this file — request dependency changes via your handoff report.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  sqflite: ^2.4.4
  sqflite_common: ^2.5.12
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.1.3
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.0
  mobile_scanner: ^7.4.1
  file_picker: ^12.2.0
  csv: ^8.0.0
  share_plus: ^13.3.0
  crypto: ^3.0.7
  uuid: ^4.6.0
  image: ^4.9.2
  collection: ^1.19.1
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  freezed: '4.0.0-dev.3'
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # Required by `flutter build` because l10n.yaml exists. The merged ARBs in
  # lib/core/l10n/arb are committed so `flutter pub get` works on a fresh clone.
  generate: true

  assets:
    - assets/brands/shelfwise/
    - assets/brands/demo-green/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
